# Nginx para MartGo: recibe el tráfico del puerto 80 y lo pasa a Next.js (PM2, puerto 3000).
# En el servidor: copiar a /etc/nginx/sites-available/martgo, enlazar en sites-enabled,
# probar con `sudo nginx -t` y recargar con `sudo systemctl reload nginx`.
server {
    listen 80;
    listen [::]:80;
    server_name martgo.tech www.martgo.tech;

    location / {
        proxy_pass http://127.0.0.1:3000;

        # HTTP/1.1 es necesario para websockets.
        proxy_http_version 1.1;

        # Datos de la petición original (Auth.js usa Host y X-Forwarded-Proto).
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Websockets.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }
}
